        <ul class="book__list reveal">
          <li data-i18n="book.b1"></li><li data-i18n="book.b2"></li>
          <li data-i18n="book.b3"></li><li data-i18n="book.b4"></li>
        </ul>
        <div class="book__pills reveal">
          <span class="pill pill--accent" data-i18n="book.free"></span>
          <span class="pill" data-i18n="book.dur"></span>
          <span class="pill" data-i18n="book.place"></span>
        </div>
      </div>

      <div class="book__panel reveal-card">
        <ol class="steps" id="bookSteps">
          <li class="is-on"><b>1</b><span data-i18n="book.step1"></span></li>
          <li><b>2</b><span data-i18n="book.step2"></span></li>
          <li><b>3</b><span data-i18n="book.step3"></span></li>
        </ol>

        <div class="book__stage" id="bookStage">

          <!-- calendar -->
          <div class="cal" id="cal">
            <div class="cal__head">
              <button class="cal__nav" id="calPrev" aria-label="Önceki ay"><svg viewBox="0 0 8 12"><path d="M7 1L2 6l5 5"/></svg></button>
              <div class="cal__month" id="calMonth"></div>
              <button class="cal__nav" id="calNext" aria-label="Sonraki ay"><svg viewBox="0 0 8 12"><path d="M1 1l5 5-5 5"/></svg></button>
            </div>
            <div class="cal__dows" id="calDows"></div>
            <div class="cal__grid" id="calGrid"></div>
            <p class="cal__note" data-i18n="book.pickdate"></p>
          </div>

          <!-- times -->
          <div class="slots" id="slots" hidden>
            <button class="back" id="toCal"><svg viewBox="0 0 8 12"><path d="M7 1L2 6l5 5"/></svg><span data-i18n="book.back"></span></button>
            <p class="slots__date" id="slotsDate"></p>
            <div class="slots__grid" id="slotsGrid"></div>
          </div>

          <!-- form -->
          <form class="bform" id="bform" hidden novalidate>
            <button type="button" class="back" id="toSlots"><svg viewBox="0 0 8 12"><path d="M7 1L2 6l5 5"/></svg><span data-i18n="book.back"></span></button>
            <p class="bform__when" id="bformWhen"></p>

            <label class="fld"><span data-i18n="book.name"></span>
              <input name="name" type="text" autocomplete="name" required></label>
            <label class="fld"><span data-i18n="book.phone"></span>
              <input name="phone" type="tel" autocomplete="tel" inputmode="tel" required placeholder="05__ ___ __ __"></label>
            <label class="fld"><span data-i18n="book.email"></span>
              <input name="email" type="email" autocomplete="email"></label>
            <label class="fld"><span data-i18n="book.service"></span>
              <select name="service" required>
                <option value="" data-i18n="book.s0"></option>
                <option data-i18n="book.s1"></option><option data-i18n="book.s2"></option>
                <option data-i18n="book.s3"></option><option data-i18n="book.s4"></option>
                <option data-i18n="book.s5"></option>
              </select></label>

            <fieldset class="fld fld--radio">
              <legend data-i18n="book.land"></legend>
              <div class="chips">
                <label><input type="radio" name="land" value="1" checked><span data-i18n="book.land1"></span></label>
                <label><input type="radio" name="land" value="2"><span data-i18n="book.land2"></span></label>
                <label><input type="radio" name="land" value="3"><span data-i18n="book.land3"></span></label>
              </div>
            </fieldset>

            <label class="fld fld--full"><span data-i18n="book.note"></span>
              <textarea name="note" rows="3"></textarea></label>

            <button type="submit" class="btn btn--solid btn--lg btn--block magnetic" data-i18n="book.submit"></button>
          </form>

          <!-- success -->
          <div class="done" id="done" hidden>
            <svg class="done__tick" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M15 27l8 8 15-16"/></svg>
            <h3 data-i18n="book.okTitle"></h3>
            <div class="done__card" id="doneCard"></div>
            <p data-i18n="book.okLead"></p>
            <div class="done__acts">
              <a class="btn btn--solid magnetic" href="tel:+905308998060" data-i18n="book.okCall"></a>
              <a class="btn btn--ghost magnetic" id="waLink" target="_blank" rel="noopener" data-i18n="book.okWa"></a>
            </div>
            <button class="link-arrow link-arrow--sm" id="again"><span data-i18n="book.again"></span></button>
          </div>

        </div>
      </div>
    </div>
  </div>
</section>
